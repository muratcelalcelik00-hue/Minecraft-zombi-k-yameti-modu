level-name=world
level-type=flat
generate-structures=false
online-mode=false
spawn-monsters=false
spawn-animals=false
# Leave this on. ServerLevel discards every Npc as it is added to the world when
# it is false, so the test villager silently never exists — which reads as a
# broken mod rather than a broken harness.
spawn-npcs=true
allow-nether=false
# Functions issue /stop, which is permission level 4.
function-permission-level=4
# The first tick loads and generates chunks; the watchdog must not kill it.
max-tick-time=-1
view-distance=10
simulation-distance=10
sync-chunk-writes=false
enable-jmx-monitoring=false
motd=Undying test server
